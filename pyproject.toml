[project]
name = "lifestyled-ai"
version = "0.1.0"
description = "Profile-aware fashion recommendation assistant using hybrid retrieval"
readme = "README.md"
authors = [
    { name = "sal", email = "75900877+thesalmajudah@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.1.0",
    "groq==0.30.0",
    "joblib==1.5.1",
    "pandas==2.3.1",
    "python-dotenv==1.1.1",
    "rank-bm25==0.2.2",
    "scikit-learn==1.7.1",
    "streamlit==1.47.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
